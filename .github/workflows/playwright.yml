name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ems
        ports:
          - 5432:5432
        # Wait for postgres to be ready before starting the job
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v1

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            tests/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('tests/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/bun.lockb') }}

      - name: Install dependencies
        run: |
          cd packages/tests
          bun install

      - name: Install Playwright Browsers
        run: |
          cd packages/tests
          bunx playwright install --with-deps

      - name: Run Migrations
        env: 
          DATABASE_URL: postgresql://user:password@localhost:5432/ems
        run: |
          cd packages/server
          bunx prisma migrate deploy

      - name: Run Playwright tests
        env: 
          DATABASE_URL: postgresql://user:password@localhost:5432/ems
          DB_PASSWORD: password
          DB_USERNAME: user
        run: |
          cd packages/tests
          bunx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/tests/playwright-report/
          retention-days: 30